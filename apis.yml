name: Acesion Pharma
description: Acesion Pharma is a clinical-stage pharmaceutical company based in Frederiksberg, Denmark,
  developing novel therapies for atrial fibrillation (AF), the most common cardiac arrhythmia. The company
  pioneers small-molecule SK ion channel inhibition as a differentiated mechanism to treat AF safely and
  effectively. Its lead program AP31969 entered Phase 2 clinical trials in January 2026, building on earlier
  work on the cardioversion candidate AP30663. Acesion Pharma is backed by venture investors including
  Canaan Partners. As a pharmaceutical R&D company it does not currently publish a public developer API,
  SDK, or API documentation; this profile captures its corporate identity and public web properties in
  the API Evangelist network.
